<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Awet: link-in-bio</title>
<meta name="description" content="Review jujur barang yang sudah dipakai bertahun-tahun. Cari nomor produk dari video, lalu beli di Shopee atau Tokopedia.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#c2541d">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Review Awet">
<meta property="og:title" content="Review Awet: barang yang masih awet">
<meta property="og:description" content="Review jujur barang yang sudah dipakai bertahun-tahun. Cari nomor produk dari video, lalu beli di Shopee atau Tokopedia.">
<meta property="og:url" content="https://reviewawet.github.io/">
<meta property="og:image" content="https://reviewawet.github.io/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f1e9; --card:#fffdf9; --ink:#221d17; --muted:#6f655a; --line:#e6ddd0;
    --accent:#c2541d; --accent-ink:#fff; --shopee:#ee4d2d; --toped:#03ac0e; --chip:#efe6d8;
    --radius:18px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#16130f; --card:#211c17; --ink:#f3ece2; --muted:#a99d8f; --line:#332b23; --chip:#2b241d; --accent:#e9773e; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:28px 18px 60px}
  header{text-align:center;margin-bottom:22px}
  .avatar{width:96px;height:96px;border-radius:50%;margin:0 auto 12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:Fraunces,serif;font-size:34px;font-weight:700;overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover}
  h1{font-family:Fraunces,serif;font-weight:700;font-size:28px;margin:0 0 4px;letter-spacing:-.01em}
  .handle{color:var(--muted);font-size:14px;margin-bottom:10px}
  .tagline{font-size:15px;line-height:1.5;margin:0 auto;max-width:400px}
  .proof{display:inline-flex;gap:6px;align-items:center;margin-top:12px;font-size:12.5px;font-weight:600;background:var(--chip);padding:6px 12px;border-radius:999px}
  .search{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 12px}
  .search label{display:block;font-size:13px;font-weight:600;margin:0 0 6px 4px}
  .search input{width:100%;font:inherit;font-size:17px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);outline:none}
  .search input:focus{border-color:var(--accent)}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;font:inherit;font-size:14px;font-weight:600;padding:9px 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  .tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .section-title{font-family:Fraunces,serif;font-size:19px;margin:18px 4px 10px}
  .list{display:grid;gap:14px}
  .card{display:grid;grid-template-columns:104px 1fr;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;position:relative}
  .card.hit{outline:2.5px solid var(--accent);outline-offset:2px}
  .thumb{width:104px;height:104px;border-radius:12px;background:var(--chip);overflow:hidden;display:grid;place-items:center;position:relative}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb svg{width:40px;height:40px;opacity:.45}
  .num{position:absolute;top:6px;left:6px;background:var(--ink);color:var(--bg);font-weight:700;font-size:13px;padding:3px 8px;border-radius:8px}
  .meta{min-width:0;display:flex;flex-direction:column}
  .name{font-weight:700;font-size:15.5px;line-height:1.3;margin:2px 0 4px}
  .age{font-size:12.5px;font-weight:600;color:var(--accent);margin-bottom:4px}
  .note{font-size:13.5px;color:var(--muted);line-height:1.45;margin:0 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .note.open{-webkit-line-clamp:unset;display:block}
  .more{display:block;text-align:left;background:none;border:0;padding:0;margin:-6px 0 10px;font:inherit;font-size:12.5px;font-weight:600;color:var(--accent);cursor:pointer}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
  .btn{flex:1 1 auto;text-align:center;text-decoration:none;font-weight:700;font-size:13.5px;padding:10px 12px;border-radius:11px;color:#fff;min-width:110px}
  .btn.shopee{background:var(--shopee)}
  .btn.toped{background:var(--toped)}
  .card.isnew .name{padding-right:52px}
  .soon{font-size:13px;font-weight:600;color:var(--muted);background:var(--chip);padding:9px 12px;border-radius:11px}
  .new{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;background:var(--accent);color:var(--accent-ink);padding:3px 8px;border-radius:6px}
  .empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14.5px}
  .demo{background:var(--chip);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:12px;text-align:center}
  footer{margin-top:34px;text-align:center;color:var(--muted);font-size:12px;line-height:1.6}
  footer a{color:inherit}
  .socials{display:flex;justify-content:center;gap:10px;margin-top:14px}
  .socials a{font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;border:1.5px solid var(--line);padding:8px 14px;border-radius:999px;background:var(--card)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="avatar" id="avatar"></div>
    <h1 id="siteName"></h1>
    <div class="handle" id="handle"></div>
    <p class="tagline" id="tagline"></p>
    <div class="proof">✓ Semua barang dipakai sendiri, bukan endorse</div>
    <div class="socials" id="socials"></div>
  </header>

  <div class="search">
    <label for="q">Cari nomor produk dari video, atau nama barangnya</label>
    <input id="q" type="search" inputmode="search" placeholder="Contoh: 12 atau blender" autocomplete="off">
  </div>
  <div class="tabs" id="tabs" role="toolbar" aria-label="Kategori"></div>

  <div id="demoNote"></div>
  <div id="newSection"></div>
  <div class="section-title" id="allTitle">Semua barang</div>
  <div class="list" id="list"></div>

  <footer>
    Halaman ini berisi link afiliasi Shopee &amp; Tokopedia. Kalau kamu beli lewat link ini, aku dapat komisi kecil tanpa biaya tambahan buat kamu. Harga dan stok bisa berubah, cek lagi di aplikasinya ya.
  </footer>
</div>

<script>
/* ============ SETTINGS: edit these ============ */
const SITE = {
  name: "Review Awet",
  handle: "@reviewawet",
  instagram: "https://instagram.com/reviewawet",
  tiktok: "https://www.tiktok.com/@reviewawet",
  tagline: "Barang yang udah kupakai bertahun-tahun & masih awet. Cari no. produk dari video di sini.",
  avatar: "img/logo.png" // e.g. "img/avatar.jpg"; empty shows the first letter
};
const CATEGORIES = ["Rumah", "Dapur", "Gadget", "Harian", "Perawatan"];

/* ============ PRODUCTS: newest goes at the top ============
   id: number shown in the Reel ("cek no. 12 di bio")
   years: how long you've used it
   image: "img/12.jpg" (file in the same folder); leave "" for a placeholder
   shopee / tokopedia: affiliate links; leave "" to hide the button
   isNew: true shows it under "Baru minggu ini"
*/
const PRODUCTS = [
  {id:15,name:"Meja belajar lipat portable",category:"Rumah",years:"lebih dari 4 tahun",note:"Meja lipat terawet yang pernah kubeli. Aman buat anak belajar atau kerja pakai laptop.",image:"img/15.jpg",shopee:"https://s.shopee.co.id/2qWRjHG0BJ",tokopedia:"https://vt.tokopedia.com/t/ZS9PqCQtnjdjc-bE98S/",isNew:true},
  {id:14,name:"Kursi anak Olymplast",category:"Rumah",years:"lebih dari 5 tahun",note:"Awet banget & murah. Minusnya ga kuat untuk yang beratnya lebih dari 90 kg.",image:"img/14.jpg",shopee:"https://s.shopee.co.id/9pgC3s4slY",tokopedia:"https://vt.tokopedia.com/t/ZS9PqQLFM9BRv-gVbwC/",isNew:true},
  {id:13,name:"Meja anak Speeds",category:"Rumah",years:"lebih dari 5 tahun",note:"Bahannya tebal & kokoh, karet kaki bisa diatur. Minusnya agak berat karena ada besi di dalam.",image:"img/13.jpg",shopee:"https://s.shopee.co.id/3LSiHFHlLm",tokopedia:"https://vt.tokopedia.com/t/ZS9Pq5hXyXs7X-EsD1O/",isNew:true},
  {id:12,name:"Air cleaner WINIX Zero S",category:"Rumah",years:"lebih dari 2 tahun",note:"Udara makin jelek, apalagi ada anak di rumah. Selama kupakai awet banget & gampang dibersihin.",image:"img/12.jpg",shopee:"https://s.shopee.co.id/W8WFV469A",tokopedia:"https://vt.tokopedia.com/t/ZS9P44KSDSP76-Tfffi/",isNew:true},
  {id:11,name:"Mesin cuci Electrolux 8 kg front load",category:"Rumah",years:"lebih dari 4 tahun",note:"Gampang dipakai & banyak mode cuci. Ingat: jangan isi lebih dari 8 kg ya.",image:"img/11.jpg",shopee:"https://s.shopee.co.id/gRwRUTHLR",tokopedia:"https://vt.tokopedia.com/t/ZS9P4XXguqudL-ND7ZA/",isNew:true},
  {id:10,name:"Oven Polytron 33L Kitchenmate",category:"Dapur",years:"lebih dari 6 bulan",note:"Buat baking & rotisserie, ga ribet, low watt. Minusnya harus rajin dibersihin biar awet.",image:"img/10.jpg",shopee:"https://s.shopee.co.id/AUvs7rVIHg",tokopedia:"https://vt.tokopedia.com/t/ZS9P49S9johfR-zh5rr/",isNew:true},
  {id:9,name:"Jemuran baju tarik (dinding)",category:"Rumah",years:"lebih dari 4 tahun",note:"Praktis, engselnya ga keras, muat banyak cucian & awet banget. Anti ribet!",image:"img/9.jpg",shopee:"https://s.shopee.co.id/8pndsM0DOY",tokopedia:"https://vt.tokopedia.com/t/ZS9PXnLDL5E22-pYRY5/",isNew:true},
  {id:8,name:"Kipas gantung Edma",category:"Rumah",years:"lebih dari 4 tahun",note:"Angin bisa diatur, 3 mode kecepatan & ada timer biar ga lupa matiin.",image:"img/8.jpg",shopee:"https://s.shopee.co.id/W8Vwz1b5h",tokopedia:"https://vt.tokopedia.com/t/ZS9PXtgAsRCpC-1gNks/",isNew:true},
  {id:7,name:"Kipas angin Air Monster",category:"Rumah",years:"lebih dari 6 tahun",note:"Tampilannya gak norak, affordable, gampang dibersihin. So far belum ada minusnya.",image:"img/7.jpg",shopee:"https://s.shopee.co.id/1W138luSsL",tokopedia:"https://vt.tokopedia.com/t/ZS9PXtPShRaXy-4qUhi/",isNew:true},
  {id:6,name:"Air fryer Lock&Lock Black Series",category:"Dapur",years:"lebih dari 3 tahun",note:"Punyaku model lama, sampai sekarang masih awet dan masih dipakai. Saran: pakai alas air fryer dari awal biar awet, aku dulu nggak. Link ke versi Black Series yang dijual sekarang.",image:"img/6.jpg",shopee:"https://s.shopee.co.id/30pq4VXFPF",tokopedia:"https://vt.tokopedia.com/t/ZS9PQPmtexdmN-UC5Qm/",isNew:true},
  {id:5,name:"Kursi lipat outdoor Speeds",category:"Harian",years:"lebih dari 2 tahun",note:"Murah, besinya kuat, praktis dibawa ke mana-mana dan disimpan di mobil. Minusnya: bautnya rawan kendor, kuakalin pakai tali tis dan so far aman.",image:"img/5.jpg",shopee:"https://s.shopee.co.id/AAJ0YxgTGD",tokopedia:"https://vt.tokopedia.com/t/ZS9PQBjcDHt43-5Hrfh/",isNew:true},
  {id:4,name:"Kran sink tarik SUS 304 (panas-dingin)",category:"Dapur",years:"lebih dari 1 tahun",note:"Bisa dari dua pipa (panas & dingin), kepala bisa ditarik dan balik sendiri, ada mode shower & air biasa. Minusnya: warnanya cuma hitam dan silver.",image:"img/4.jpg",shopee:"https://s.shopee.co.id/3LSgPaSjjB",tokopedia:"https://vt.tokopedia.com/t/ZS9PQh3r56K39-bC9NP/",isNew:true},
       {id:3,name:"Kunci bulat PVC pintu kamar mandi (GMP)",category:"Rumah",years:"",note:"Baru beli & baru pasang buat ganti kunci pintu kamar mandi. Nanti kuupdate lagi apakah awet.",image:"img/3.jpg",shopee:"https://s.shopee.co.id/1qds5C18Jv",tokopedia:"https://vt.tokopedia.com/t/ZS9P9spvQEmMd-TTQmN/",isNew:true},
  {id:2,name:"Xiaomi Mi Power Strip 3 colokan + 3 USB",category:"Gadget",years:"lebih dari 10 tahun",note:"Udah dipakai lebih dari 10 tahun dan masih awet.",image:"img/2.jpg",shopee:"https://s.shopee.co.id/114l5ZsVXR",tokopedia:"https://vt.tokopedia.com/t/ZS9P9sQuX1Vsp-G2azi/",isNew:true},
  {id:1,name:"Nespresso Touch Travel Mug (stainless)",category:"Harian",years:"lebih dari 4 tahun",note:"Es batu awet sampai 12 jam, air panas masih hangat setelah 6 jam. Udah jatuh berkali-kali, suhunya tetap terjaga. Minusnya: tutupnya agak ribet dicuci. Di Shopee: versi terbaru (Travel Mug 400 ml) dari Nespresso Official Shop.",image:"img/1.jpg",shopee:"https://s.shopee.co.id/8KrJYwOZN3",tokopedia:"https://vt.tokopedia.com/t/ZS9P5AQ3eYVWH-bCHJs/",isNew:true},
];

/* Example cards, shown only while PRODUCTS is empty */
const DEMO = [
  {id:3,name:"Contoh: Rice cooker digital 1,8 L",category:"Dapur",years:"lebih dari 4 tahun",note:"Tiap hari dipakai, nasi tetap pulen. Tutup bagian dalam masih rapat.",image:"",shopee:"#",tokopedia:"#",isNew:true},
  {id:2,name:"Contoh: Power bank 10.000 mAh",category:"Gadget",years:"3 tahun",note:"Masih kuat isi HP hampir 2x penuh. Agak berat tapi awet.",image:"",shopee:"#",tokopedia:"",isNew:false},
  {id:1,name:"Contoh: Rak sepatu besi 5 susun",category:"Rumah",years:"5 tahun",note:"Tidak goyang, cat belum mengelupas. Rakitnya 15 menit.",image:"",shopee:"",tokopedia:"#",isNew:false}
];
/* ========================================================== */

const data = PRODUCTS.length ? PRODUCTS : DEMO;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^(https?:\/\/|#$)/i.test(u||"") ? u : "";

$("#siteName").textContent = SITE.name;
$("#handle").textContent = SITE.handle;
$("#tagline").textContent = SITE.tagline;
document.title = SITE.name + ": link-in-bio";
if (SITE.avatar) $("#avatar").innerHTML = `<img src="${esc(SITE.avatar)}" alt="">`;
else $("#avatar").textContent = SITE.name.trim().charAt(0).toUpperCase();
$("#socials").innerHTML = [["Instagram",SITE.instagram],["TikTok",SITE.tiktok]].filter(x=>x[1]).map(([n,u])=>`<a href="${esc(safeUrl(u))}" target="_blank" rel="noopener">${n}</a>`).join("");
if (!PRODUCTS.length) $("#demoNote").innerHTML = `<div class="demo">Ini contoh tampilan. Produk asli akan muncul di sini.</div>`;

const placeholder = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>`;

function card(p, highlight){
  const img = p.image ? `<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.display='none'">` : placeholder;
  const s = safeUrl(p.shopee), t = safeUrl(p.tokopedia);
  return `<article class="card${highlight?' hit':''}${p.isNew?' isnew':''}" id="p${esc(p.id)}">
    <div class="thumb">${img}<span class="num">No. ${esc(p.id)}</span></div>
    <div class="meta">
      <div class="name">${esc(p.name)}</div>
      ${p.years?`<div class="age">Sudah dipakai ${esc(p.years)}</div>`:""}
      ${p.note?`<p class="note">${esc(p.note)}</p><button type="button" class="more" hidden>Selengkapnya</button>`:""}
      <div class="btns">
        ${s?`<a class="btn shopee" href="${esc(s)}" target="_blank" rel="noopener sponsored">Beli di Shopee</a>`:""}
        ${t?`<a class="btn toped" href="${esc(t)}" target="_blank" rel="noopener sponsored">Beli di Tokopedia</a>`:""}
        ${(!s&&!t)?`<span class="soon">Link segera ditambahkan</span>`:""}
      </div>
    </div>
    ${p.isNew?`<span class="new">BARU</span>`:""}
  </article>`;
}

let cat = "Semua";
const cats = ["Semua", ...CATEGORIES.filter(c => data.some(p => p.category === c))];
$("#tabs").innerHTML = cats.map(c => `<button class="tab" aria-pressed="${c===cat}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if(!b) return;
  cat = b.dataset.c;
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-pressed", x.dataset.c===cat));
  render();
});
$("#q").addEventListener("input", render);

function render(){
  const q = $("#q").value.trim().toLowerCase().replace(/^no\.?\s*/,"");
  const isNum = /^\d+$/.test(q);
  let items = data.filter(p => cat==="Semua" || p.category===cat);
  if (q) items = isNum ? items.filter(p => String(p.id)===q || String(p.id).startsWith(q))
                       : items.filter(p => (p.name+" "+(p.note||"")+" "+(p.category||"")).toLowerCase().includes(q));
  items.sort((a,b) => (isNum && String(b.id)===q) - (isNum && String(a.id)===q) || b.id - a.id);

  const fresh = (!q && cat==="Semua") ? data.filter(p => p.isNew) : [];
  $("#newSection").innerHTML = fresh.length ? `<div class="section-title">Baru minggu ini</div><div class="list">${fresh.map(p=>card(p)).join("")}</div>` : "";
  if (fresh.length) items = items.filter(p => !p.isNew);
  $("#allTitle").textContent = q ? `Hasil untuk “${$("#q").value.trim()}”` : (cat==="Semua" ? "Semua barang" : cat);
  $("#allTitle").style.display = (!items.length && fresh.length) ? "none" : "";
  if (!items.length && fresh.length) { $("#list").innerHTML = ""; return; }
  $("#list").innerHTML = items.length ? items.map(p => card(p, isNum && String(p.id)===q)).join("")
    : `<div class="empty">Belum ketemu. Coba nomor lain, atau cek caption videonya ya.</div>`;
}

const h = location.hash.replace("#","");
if (/^\d+$/.test(h)) $("#q").value = h;
render();
</script>
<script>
function fixNotes(){document.querySelectorAll('.note').forEach(n=>{const b=n.nextElementSibling;if(!b||!b.classList.contains('more'))return;if(!n.classList.contains('open'))b.hidden=n.scrollHeight<=n.clientHeight+1;b.onclick=()=>{const o=n.classList.toggle('open');b.textContent=o?'Tutup':'Selengkapnya';};});}
new MutationObserver(fixNotes).observe(document.body,{childList:true,subtree:true});addEventListener('load',fixNotes);addEventListener('resize',fixNotes);
</script>
</body>
</html>
